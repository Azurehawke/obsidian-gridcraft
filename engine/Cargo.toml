[package]
name = "gridcraft-obsidian-engine"
version = "0.7.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "GridCraft's spreadsheet engine for the GridCraft Viewer Obsidian plugin (WebAssembly)"
publish = false

# Built on its own, not as part of a larger workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to a commit of the fork, so a plugin release always rebuilds the same engine.
# To move to newer GridCraft code, change `rev` (on all three lines) and let CI rebuild.
gridcraft-engine = { git = "https://github.com/Azurehawke/gridcraft", rev = "4eb2fb5c8ed30a580acf24234fffb2cb6256e335" }
gridcraft-chart = { git = "https://github.com/Azurehawke/gridcraft", rev = "4eb2fb5c8ed30a580acf24234fffb2cb6256e335" }
gridcraft-pdf = { git = "https://github.com/Azurehawke/gridcraft", rev = "4eb2fb5c8ed30a580acf24234fffb2cb6256e335" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
panic = "abort"
