name: Release

# Publishes a release whenever manifest.json on main carries a version that has no release yet:
# bump the version (manifest.json, package.json, versions.json) and push. The release and its tag
# (the bare version, no "v") are created here. Pushing a version tag, or running this workflow
# by hand from the Actions tab, works too.
# BRAT installs main.js, manifest.json and styles.css; the plugin downloads gridcraft-engine.wasm.gz itself.
on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest.json version $version" >&2
            exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.skip != 'true'
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip != 'true'
        with:
          workspaces: engine

      - name: Install wasm-opt
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/binaryen"
          mkdir -p "$dir"
          gh release download --repo WebAssembly/binaryen --pattern '*x86_64-linux.tar.gz' --dir "$dir"
          tar -xzf "$dir"/*.tar.gz -C "$dir"
          bin=$(dirname "$(find "$dir" -type f -name wasm-opt | head -n 1)")
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/wasm-opt" --version

      - name: Build engine
        if: steps.version.outputs.skip != 'true'
        run: bash scripts/build-engine.sh

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Build plugin
        if: steps.version.outputs.skip != 'true'
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package engine
        if: steps.version.outputs.skip != 'true'
        run: |
          gzip -9 -c engine/pkg/gridcraft_obsidian_engine_bg.wasm > gridcraft-engine.wasm.gz
          ls -l main.js gridcraft-engine.wasm.gz engine/pkg/gridcraft_obsidian_engine_bg.wasm

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" \
            main.js manifest.json styles.css gridcraft-engine.wasm.gz \
            --title "${{ steps.version.outputs.version }}" --generate-notes
