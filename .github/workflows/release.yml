name: Release

# Push a tag equal to manifest.json's version (no "v"), for example `git tag 0.1.0 && git push origin 0.1.0`.
# BRAT installs main.js, manifest.json and styles.css; the plugin downloads gridcraft-engine.wasm.gz itself.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest.json version $version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install wasm-opt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/binaryen"
          mkdir -p "$dir"
          gh release download --repo WebAssembly/binaryen --pattern '*x86_64-linux.tar.gz' --dir "$dir"
          tar -xzf "$dir"/*.tar.gz -C "$dir"
          bin=$(dirname "$(find "$dir" -type f -name wasm-opt | head -n 1)")
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/wasm-opt" --version

      - name: Build engine
        run: bash scripts/build-engine.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build plugin
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package engine
        run: |
          gzip -9 -c engine/pkg/gridcraft_obsidian_engine_bg.wasm > gridcraft-engine.wasm.gz
          ls -l main.js gridcraft-engine.wasm.gz engine/pkg/gridcraft_obsidian_engine_bg.wasm

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css gridcraft-engine.wasm.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
